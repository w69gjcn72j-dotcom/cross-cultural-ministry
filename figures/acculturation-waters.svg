<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Three bands of water from left to right: the river where the first generation swims freely, the bay of transition where the bicultural generation moves between fresh and salt water, and the open sea of the majority culture."
     font-family="Inter Tight, system-ui, -apple-system, sans-serif">

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#0E3634"/>
      <stop offset="0.45" stop-color="#12484A"/>
      <stop offset="1"    stop-color="#0B2C2B"/>
    </linearGradient>
  </defs>

  <rect x="30" y="70" width="700" height="150" rx="10" fill="url(#water)"
        stroke="#9DB4AF" stroke-opacity="0.22"/>

  <!-- the two boundaries, drawn as blur rather than as walls -->
  <g stroke="#C96F4C" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="5 6">
    <line x1="263" y1="70" x2="263" y2="220"/>
    <line x1="497" y1="70" x2="497" y2="220"/>
  </g>

  <!-- current lines -->
  <g stroke="#9DB4AF" stroke-opacity="0.28" stroke-width="1.5" fill="none">
    <path d="M60 120 q40 -12 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
    <path d="M60 168 q40 12 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0"/>
  </g>

  <!-- three fish, one per water -->
  <g fill="#E8B08C">
    <path d="M120 145 q22 -16 44 0 q-22 16 -44 0 z"/>
    <path d="M164 145 l14 -9 v18 z"/>
    <path d="M356 145 q22 -16 44 0 q-22 16 -44 0 z"/>
    <path d="M400 145 l14 -9 v18 z"/>
    <path d="M592 145 q22 -16 44 0 q-22 16 -44 0 z"/>
    <path d="M636 145 l14 -9 v18 z"/>
  </g>

  <!-- headings -->
  <g fill="#ECF1EE" font-size="17">
    <text x="146" y="55" text-anchor="middle">The river</text>
    <text x="380" y="55" text-anchor="middle">The bay</text>
    <text x="614" y="55" text-anchor="middle">The open sea</text>
  </g>

  <!-- captions -->
  <g fill="#9DB4AF" font-size="14">
    <text x="146" y="256" text-anchor="middle">First generation</text>
    <text x="146" y="276" text-anchor="middle">at home in one culture</text>

    <text x="380" y="256" text-anchor="middle">Bicultural generation</text>
    <text x="380" y="276" text-anchor="middle">moving between the two</text>

    <text x="614" y="256" text-anchor="middle">Majority culture</text>
    <text x="614" y="276" text-anchor="middle">the wider community</text>
  </g>

  <g fill="#6F8B87" font-size="12.5" letter-spacing="1.4">
    <text x="146" y="304" text-anchor="middle">FRESH WATER</text>
    <text x="380" y="304" text-anchor="middle">BRACKISH</text>
    <text x="614" y="304" text-anchor="middle">SALT WATER</text>
  </g>
</svg>
