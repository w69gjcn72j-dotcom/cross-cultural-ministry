<main class="wrap">

    福音跨越文化的思考。作者生於香港，一九八三年移居澳洲，現於雪梨聖公會堂會牧養華人與英語會眾。

<script>
/* ---------------------------------------------------------------------
   POSTS — 中文版文章清單。
   add-post.py 會自動加入新條目；亦可手動編輯，最新的放最前，
   每一條目的格式保持一致即可。
   --------------------------------------------------------------------- */
const POSTS = [
];
/* --------------------------------------------------------------- end POSTS */

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  if (!y || !m || !d) return iso;
  return y + "年" + m + "月" + d + "日";
}

const list = document.getElementById("posts");

if (!POSTS.length) {
  list.outerHTML = '<div class="empty">暫未有文章。</div>';
} else {
  // newest first, whatever order the entries happen to sit in
  const ordered = POSTS.slice().sort((a, b) => (b.n || 0) - (a.n || 0));
  list.innerHTML = ordered.map(p => `
    <li>
      <a href="${p.slug}">
        <div class="post-meta cjk">
          <span class="num">${String(p.n).padStart(3, "0")}</span>
          <span>${prettyDate(p.date)}</span>
        </div>
        <h2 class="post-title">${p.title}</h2>
        ${p.blurb ? `<p class="post-blurb">${p.blurb}</p>` : ""}
      </a>
    </li>`).join("");
}
</script>

</body>
