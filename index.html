const MONTHS = ["January","February","March","April","May","June",
                "July","August","September","October","November","December"];

function prettyDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  if (!y || !m || !d) return iso;
  return d + " " + MONTHS[m - 1] + " " + y;
}

const list = document.getElementById("posts");

if (!POSTS.length) {
  list.outerHTML = '<div class="empty">No essays yet.</div>';
} else {
  // newest first, whatever order the entries happen to sit in
  const ordered = POSTS.slice().sort((a, b) => (b.n || 0) - (a.n || 0));
  list.innerHTML = ordered.map(p => `
    <li>
      <a href="${p.slug}">
        <div class="post-meta">
          <span class="num">${String(p.n).padStart(3, "0")}</span>
          <span>${prettyDate(p.date)}</span>
        </div>
        <h2 class="post-title">${p.title}</h2>
        ${p.blurb ? `<p class="post-blurb">${p.blurb}</p>` : ""}
      </a>
    </li>`).join("");
}
